<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kody DOG OS</title>
  <meta name="description" content="A pure static, read-only desktop shell over the public kody-w.github.io DOG volume.">
  <link rel="stylesheet" href="styles.css">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="kody-w">
<meta property="og:url" content="https://kody-w.github.io/OS/">
<meta property="og:title" content="RAPP OS — a read-only desktop over your public site">
<meta property="og:description" content="Mounts kody-w.github.io as a public volume (the DOG). Read-only, public bytes only, no server.">
<meta property="og:image" content="https://kody-w.github.io/OS/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="RAPP OS — a read-only desktop over your public site">
<meta name="twitter:description" content="Mounts kody-w.github.io as a public volume (the DOG). Read-only, public bytes only, no server.">
<meta name="twitter:image" content="https://kody-w.github.io/OS/og.png">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="eyebrow">public bytes only</div>
        <h1>Kody DOG OS</h1>
      </div>
      <div class="status" id="boot-status">booting static api…</div>
    </header>
    <section class="desktop" aria-label="Desktop shell">
      <aside class="dock" aria-label="Installed apps">
        <div class="eyebrow">apps from api/apps.json</div>
        <p class="small">This OS is read-only. It mounts public site bytes; it does not write, store private data, or protect secrets.</p>
        <nav class="dock-list" id="dock-list"></nav>
      </aside>
      <section class="window" id="window" aria-live="polite">
        <p>Loading…</p>
      </section>
    </section>
    <footer class="footer">Served from a subpath with relative internal links. Direct internals route: <a href="system32/">system32/</a>.</footer>
  </main>
  <script type="module" src="client.js"></script>
</body>
</html>
