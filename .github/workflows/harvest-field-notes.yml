name: Harvest Field Notes Snapshot

# Article XXIV (the Static Data Covenant, kody-w/RAR CONSTITUTION.md): pages read
# committed static data, never the GitHub API. now.html discovers rappterbook
# field notes from state/field_notes.json — this workflow keeps that snapshot
# fresh, in the same shape the contents API used to return to the browser.

on:
  schedule:
    - cron: '17 * * * *'  # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Harvest field-notes directory listing
        run: python3 scripts/harvest_field_notes.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/field_notes.json
          git diff --cached --quiet || { git commit -m "chore: refresh field-notes snapshot [skip ci]"; git push; }
