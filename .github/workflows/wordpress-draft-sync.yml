name: WordPress Draft Sync

on:
  workflow_run:
    workflows:
      - Refresh Weekly Signal
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      surface:
        description: Content to mirror as WordPress drafts
        required: true
        default: pages
        type: choice
        options:
          - pages
          - weekly
          - posts
          - all
      since:
        description: Optional earliest post date (YYYY-MM-DD)
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: wordpress-draft-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.conclusion == 'success' &&
       vars.WORDPRESS_WEEKLY_SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: wordpress-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Validate configured secrets
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          test -n "$WP_URL"
          test -n "$WP_USER"
          test -n "$WP_APP_PASSWORD"

      - name: Mirror approved content as drafts
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          INPUT_SURFACE: ${{ github.event_name == 'workflow_run' && 'weekly' || inputs.surface }}
          INPUT_SINCE: ${{ inputs.since }}
          REFRESH_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          surface="${INPUT_SURFACE:-weekly}"
          args=(--apply --surface "$surface")
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            expected_as_of="$(python3 -c 'import os; from datetime import datetime, timedelta; triggered = datetime.fromisoformat(os.environ[\"REFRESH_CREATED_AT\"].replace(\"Z\", \"+00:00\")).date(); print(triggered - timedelta(days=triggered.weekday() + 1))')"
            args+=(--expected-as-of "$expected_as_of" --wait-seconds 1200)
          fi
          if [ -n "$INPUT_SINCE" ]; then
            args+=(--since "$INPUT_SINCE")
          fi
          python3 scripts/sync_wordpress.py "${args[@]}"
