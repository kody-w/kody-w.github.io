name: Validate Posts

on:
  push:
    paths:
      - '_posts/**'
      - '_twin_posts/**'
      - '_layouts/**'
      - '_includes/**'
      - 'js/**'
      - 'css/**'
      - 'twin/**'
      - 'api/twin-corpus.json'
      - 'api/works.json'
      - 'docs/twin-contract.md'
      - 'scripts/build_twin.py'
      - 'scripts/build_twin_release.py'
      - 'scripts/benchmark_twin.js'
      - 'scripts/check_twin.py'
      - 'tests/**'
      - 'README.md'
      - '_config.yml'
      - '.github/workflows/validate-posts.yml'
  pull_request:
    paths:
      - '_posts/**'
      - '_twin_posts/**'
      - '_layouts/**'
      - '_includes/**'
      - 'js/**'
      - 'css/**'
      - 'twin/**'
      - 'api/twin-corpus.json'
      - 'api/works.json'
      - 'docs/twin-contract.md'
      - 'scripts/build_twin.py'
      - 'scripts/build_twin_release.py'
      - 'scripts/benchmark_twin.js'
      - 'scripts/check_twin.py'
      - 'tests/**'
      - 'README.md'
      - '_config.yml'
      - '.github/workflows/validate-posts.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Validate front matter
        run: |
          exit_code=0
          for file in _posts/*.md; do
            [ -f "$file" ] || continue

            # Check filename format
            basename=$(basename "$file")
            if ! echo "$basename" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}-.+\.md$'; then
              echo "::error file=$file::Invalid filename format. Expected YYYY-MM-DD-slug.md"
              exit_code=1
            fi

            # Extract front matter (between first two ---)
            front_matter=$(sed -n '/^---$/,/^---$/p' "$file" | sed '1d;$d')

            # Check required fields
            for field in layout title date; do
              if ! echo "$front_matter" | grep -q "^${field}:"; then
                echo "::error file=$file::Missing required front matter field: $field"
                exit_code=1
              fi
            done

            # Validate layout is 'post'
            layout=$(echo "$front_matter" | grep '^layout:' | sed 's/layout: *//')
            if [ "$layout" != "post" ]; then
              echo "::error file=$file::Layout must be 'post', got '$layout'"
              exit_code=1
            fi
          done

          if [ $exit_code -eq 0 ]; then
            echo "✅ All posts have valid front matter"
          fi
          exit $exit_code

      - name: Run site and copy accessibility tests
        run: |
          python -m pip install -r tests/requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/copy_accessibility.test.js
          python3 scripts/check_twin.py

      - name: Build Jekyll site
        run: |
          gem install jekyll --no-document
          jekyll build --destination _site
