name: Refresh Public Works Catalog

on:
  schedule:
    - cron: "25 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.4.22'
          bundler-cache: true

      - name: Refresh public repository snapshot and pinned twin release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_works.py
          python3 scripts/build_twin_release.py

      - name: Validate complete twin release
        run: python3 scripts/check_twin.py

      - name: Commit changed snapshot
        id: commit
        run: |
          python3 scripts/stage_refresh_release.py \
            --github-output "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "Public works and twin release are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Refresh public works and twin release" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push

      - name: Build locked Pages artifact
        if: steps.commit.outputs.changed == 'true'
        run: bundle exec jekyll build --strict_front_matter --destination _site
        env:
          JEKYLL_ENV: production

      - name: Upload locked Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy locked Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
